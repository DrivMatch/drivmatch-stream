name: Stream Now Android debug APK (development only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'tests/streamnow_domain_cutover.test.mjs'
      - '.github/workflows/streamnow-android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tests/streamnow_domain_cutover.test.mjs'
      - '.github/workflows/streamnow-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Universal favorites preservation release gate
        run: node --test tests/streamnow_favorites_data_safety.test.mjs tests/streamnow_universal_favorites_scope.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prevent hostname regression
        run: node --test tests/streamnow_domain_cutover.test.mjs
      - name: Test strict native branding, host and theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          j=Path('android/app/src/main/java/com/streamnow/app/MainActivity.java').read_text()
          m=Path('android/app/src/main/AndroidManifest.xml').read_text()
          g=Path('android/app/build.gradle').read_text()
          assert 'https://streamnow-2o1.pages.dev/' in j and 'https://streamnow-2o1.pages.dev/' in g
          assert 'drivmatch' not in (j+m+g).lower()
          assert 'com.streamnow.app' in j and 'com.streamnow.app' in g
          assert 'Stream Now' in m
          assert 'drivmatch.com' not in (j+m+g).lower()
          assert 'Color.rgb(9,9,9)' in j and 'Color.rgb(184,0,40)' in j
          assert 'R.drawable.streamnow_wordmark' in j
          PY
      - name: Use the transparent canonical-derived Android icon
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/verify_streamnow_brand.py site
          cp site/streamnow-icon.webp android/app/src/main/res/drawable-nodpi/streamnow_icon.webp
          python3 - <<'PY'
          from PIL import Image
          image=Image.open("android/app/src/main/res/drawable-nodpi/streamnow_icon.webp")
          assert image.mode=="RGBA" and image.getextrema()[3][0]==0
          PY
      - name: Build installable Android debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK zip and embedded official host
        run: |
          set -euo pipefail
          a=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$a"
          unzip -t "$a" > /dev/null
          test "$(stat -c '%s' "$a")" -gt 10000
          sha256sum "$a" | tee streamnow-android-debug-sha256.txt
          echo 'Stream Now Android debug/beta built. Not device-homologated.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: StreamNow-Android-debug-APK-NOT-FOR-PLAY
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

