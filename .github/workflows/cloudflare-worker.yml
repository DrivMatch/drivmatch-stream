name: Deploy DrivMatch Stream private Worker to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-worker.yml'
      - 'cloudflare/stream-proxy.mjs'
      - 'tests/stream_worker.test.mjs'
permissions:
  contents: read
concurrency:
  group: drivmatch-stream-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax and access-denial tests
        run: |
          node --input-type=module --check < cloudflare/stream-proxy.mjs
          node --test tests/stream_worker.test.mjs
      - name: Require Cloudflare deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Configure Cloudflare API token and account ID in GitHub secrets."
            exit 1
          fi
      - name: Check if private Stream password exists
        id: password
        env:
          PRIVATE_PASSWORD: ${{ secrets.STREAM_ACCESS_PASSWORD }}
        run: |
          if [ -z "$PRIVATE_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Private password missing; Worker deployment skipped safely. Create STREAM_ACCESS_PASSWORD as GitHub Actions secret."
          elif [ "$(printf %s "$PRIVATE_PASSWORD" | wc -c)" -lt 20 ]; then
            echo "::error::Private password must be at least 20 characters."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy private Worker and encrypted password together
        if: steps.password.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STREAM_PASSWORD: ${{ secrets.STREAM_ACCESS_PASSWORD }}
        run: |
          umask 077
          SECRET_FILE="$(mktemp)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          python3 -c 'import os,json,sys; json.dump({"STREAM_ACCESS_PASSWORD":os.environ["STREAM_PASSWORD"]},open(sys.argv[1],"w"))' "$SECRET_FILE"
          npx --yes wrangler@4 deploy --config wrangler.jsonc --secrets-file "$SECRET_FILE"
