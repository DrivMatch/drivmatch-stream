name: Stream Now OPS Sentinel preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/streamnow_ops_policy.mjs'
      - 'scripts/streamnow_ops_sentinel.mjs'
      - 'tests/streamnow_ops_policy.test.mjs'
      - '.github/workflows/streamnow-ops-sentinel.yml'
      - '.github/workflows/streamnow-ops-sentinel-preflight.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check scripts/streamnow_ops_policy.mjs
          node --check scripts/streamnow_ops_sentinel.mjs
      - name: Incident rule test
        run: node --test tests/streamnow_ops_policy.test.mjs
