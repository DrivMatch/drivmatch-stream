name: Decode Stream Now public live catalog samples
on:
  workflow_dispatch:
  push:
    branches: [codex/stream-now-launch-preflight]
    paths:
      - '.github/workflows/streamnow-live-playback.yml'
permissions:
  contents: read
jobs:
  decode:
    if: github.repository == 'DrivMatch/drivmatch-stream'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Install FFmpeg
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: imageio-ffmpeg==0.6.0
      - name: Decode frames from public broadcaster streams in the existing catalog
        run: |
          set -o pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import subprocess
          import time
          from urllib.parse import urlsplit
          from imageio_ffmpeg import get_ffmpeg_exe
          from scripts.daily_channel_autopilot import fetch_bytes, probe_once

          known = {
              "Canal Gov": "canalgov-stream.ebc.com.br",
              "TV Brasil": "tvbrasil-stream.ebc.com.br",
              "TV Brasil Internacional": "tvbrasilinternacional-stream.ebc.com.br",
              "Record News": "rnw-rn.otteravision.com",
              "SBT News": "dai.google.com",
          }
          candidates = {}
          name = ""
          for line in Path("site/daily-autopilot.m3u8").read_text().splitlines():
              if line.startswith("#EXTINF:"):
                  name = line.rsplit(",", 1)[-1]
              elif name in known and line.startswith("https://"):
                  url = urlsplit(line)
                  if url.hostname == known[name] and url.port is None and url.username is None:
                      candidates[name] = line
                  name = ""

          print("Verified catalog commit " + subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip())
          successes = 0
          ffmpeg = get_ffmpeg_exe()

          def fetch_live_video(stream):
              sample = b""

              def capture(url, limit, deadline, segment=False):
                  nonlocal sample
                  if not segment:
                      return fetch_bytes(url, limit, deadline)
                  sample = fetch_bytes(url, 4 * 1024 * 1024, deadline)
                  return sample

              if probe_once(stream, time.monotonic() + 20, getter=capture) and sample[:1] in (b"G", b"I"):
                  return sample
              return b""

          for name, stream in candidates.items():
              command = [
                  ffmpeg, "-nostdin", "-hide_banner", "-loglevel", "error",
                  "-protocol_whitelist", "pipe", "-f", "mpegts",
                  "-i", "pipe:0", "-t", "4", "-map", "0:v:0", "-an", "-f", "framemd5", "-",
              ]
              try:
                  sample = fetch_live_video(stream)
                  if not sample:
                      print(f"{name} did not provide an unencrypted MPEG-TS sample.")
                      continue
                  result = subprocess.run(command, input=sample, capture_output=True, timeout=15, check=False)
              except (OSError, ValueError) as error:
                  print(f"{name} sample could not be retrieved ({type(error).__name__}).")
                  continue
              except subprocess.TimeoutExpired:
                  print(f"{name} reached the playback timeout.")
                  continue
              frames = sum(line[:1].isdigit() for line in result.stdout.splitlines())
              if result.returncode == 0 and frames >= 10:
                  successes += 1
                  print(f"{name} decoded {frames} live video frames.")
              else:
                  details = " ".join(result.stderr.decode(errors="replace").splitlines()[-2:])
                  print(f"{name} decoded {frames} frames, exit {result.returncode}. {details[:500]}")
          if successes < 1:
              raise SystemExit("No public live sample could be decoded.")
          PY
