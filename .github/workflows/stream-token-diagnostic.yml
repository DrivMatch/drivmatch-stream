name: Stream Cloudflare credential diagnostics (read-only)
on:
  push:
    branches: [feature/independent-cloudflare-access]
    paths: ['.github/workflows/stream-token-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-secret:
    name: Verify repository-scoped token
    runs-on: ubuntu-24.04
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.STREAM_INDEPENDENT_CF_API_TOKEN }}
    steps:
      - name: Read-only Cloudflare diagnostics, no secrets printed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Repo secret present: NO"; exit 1
          fi
          echo "Repo secret present: YES"
          if [[ "$CF_TOKEN" == cfat_* ]]; then
            echo "Token format: account token"
          else
            echo "Token format: non-account-token (not disclosing value)"
          fi
          for endpoint in "accounts/$CF_ACCOUNT/tokens/verify" "user/tokens/verify" "accounts/$CF_ACCOUNT/d1/database?per_page=1"; do
            set +e
            http=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/cf-check.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/$endpoint" -H "Authorization: Bearer $CF_TOKEN")
            curl_exit=$?
            set -e
            if [ "$curl_exit" -ne 0 ]; then
              echo "Endpoint check: network error"; continue
            fi
            echo "Endpoint ${endpoint%%\?*}: HTTP $http"
            if [ "$http" = "200" ]; then
              jq -r 'if .success == true then "Result: authorized" else "Result: API rejected" end' /tmp/cf-check.json
            else
              jq -r 'if .errors then (.errors | map(.code|tostring) | join(",")) | "Cloudflare error codes: " + . else "No Cloudflare error code" end' /tmp/cf-check.json 2>/dev/null || true
            fi
          done
  environment-secret:
    name: Verify staging environment effective token
    runs-on: ubuntu-24.04
    environment: stream-independent-test
    env:
      CF_ACCOUNT: ${{ secrets.STREAM_INDEPENDENT_CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.STREAM_INDEPENDENT_CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read-only staging token D1 API check
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Staging secret present: NO"; exit 1
          fi
          echo "Staging secret present: YES"
          if [[ "$CF_TOKEN" == cfat_* ]]; then
            echo "Token format: account token"
          else
            echo "Token format: non-account-token (not disclosing value)"
          fi
          http=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/cf-check.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database?per_page=1" -H "Authorization: Bearer $CF_TOKEN")
          echo "D1 API: HTTP $http"
          if [ "$http" = "200" ]; then
            jq -r 'if .success == true then "Result: authorized" else "Result: API rejected" end' /tmp/cf-check.json
          else
            jq -r 'if .errors then (.errors | map(.code|tostring) | join(",")) | "Cloudflare error codes: " + . else "No Cloudflare error code" end' /tmp/cf-check.json 2>/dev/null || true
          fi
