plugins {
    id 'com.android.application'
}
android {
    namespace 'com.drivmatch.stream'
    compileSdk 35
    defaultConfig {
        applicationId "com.drivmatch.stream"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0-test"
        def url = System.getenv("STREAM_URL") ?: ""
        buildConfigField "String", "STREAM_DEFAULT_URL", "\"" + url.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
