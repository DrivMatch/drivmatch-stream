name: Stream Now Cloudflare Pages
on:
  push:
    branches: [main, codex/stream-now-launch-pages]
    paths:
      - '.github/workflows/streamnow-pages.yml'
      - 'cloudflare/**'
      - 'wrangler.streamnow.jsonc'
      - 'site/**'
      - 'scripts/verify_streamnow_brand.py'
      - 'tests/streamnow_pages.test.mjs'
      - 'tests/streamnow_pages_accounts.test.mjs'
      - 'tests/streamnow_domain_cutover.test.mjs'
      - 'tests/streamnow_brand_lock.test.mjs'
      - 'tests/streamnow_red_theme.test.mjs'
      - 'tests/streamnow_palette_source.test.mjs'
      - 'tests/streamnow_favorites_data_safety.test.mjs'
      - 'tests/streamnow_universal_favorites_scope.test.mjs'
      - 'docs/STREAMNOW_FAVORITES_DATA_CONSTITUTION.md'
      - 'AGENTS.md'
      - 'emails/**'
      - '00_CANONICO/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: streamnow-pages-${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run authentication and route tests
        run: |
          node --input-type=module --check < cloudflare/stream-proxy.mjs
          node --test tests/stream_worker.test.mjs tests/streamnow_pages.test.mjs tests/streamnow_pages_accounts.test.mjs tests/streamnow_domain_cutover.test.mjs tests/streamnow_brand_lock.test.mjs tests/streamnow_red_theme.test.mjs tests/streamnow_palette_source.test.mjs tests/streamnow_favorites_data_safety.test.mjs tests/streamnow_universal_favorites_scope.test.mjs
      - name: Validate deployment inputs
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_KEY: ${{ secrets.STREAM_ACCESS_PASSWORD }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Cloudflare Pages token missing (requires Account:Cloudflare Pages:Edit)"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Cloudflare account ID missing"; exit 1; }
          test "${#ACCESS_KEY}" -ge 16 || { echo "::error::Stream access secret missing or short"; exit 1; }
      - name: Build Pages static assets and advanced-mode Worker
        run: |
          npm install --no-save --no-audit --no-fund esbuild@0.25.12
          mkdir -p dist
          cp -a site/. dist/
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/verify_streamnow_brand.py dist
          npx esbuild cloudflare/streamnow-pages.mjs --bundle --platform=browser --format=esm --outfile=dist/_worker.js
          test -s dist/_worker.js
          test -s dist/tv.html
          test -s dist/streamnow-brand.webp
          test -s dist/streamnow-icon.webp
          test -s dist/daily-autopilot.m3u8
      - name: Create or reuse Cloudflare Pages project
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes wrangler@4 pages project create streamnow --production-branch main --config wrangler.streamnow.jsonc; then
            echo "::notice::Checking whether streamnow already exists and is accessible"
            npx --yes wrangler@4 pages project list --config wrangler.streamnow.jsonc > /tmp/streamnow-pages-project-list.txt
            grep -Fq streamnow /tmp/streamnow-pages-project-list.txt || { echo "::error::Pages project unavailable or Cloudflare Pages:Edit permission missing"; exit 1; }
          fi
      - name: Configure protected access on Pages
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_KEY: ${{ secrets.STREAM_ACCESS_PASSWORD }}
        run: |
          printf %s "$ACCESS_KEY" | npx --yes wrangler@4 pages secret put STREAM_ACCESS_PASSWORD --project-name streamnow --config wrangler.streamnow.jsonc
      - name: Configure Supabase sign-in (public API key only)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SB_URL: ${{ secrets.STREAM_SUPABASE_URL }}
          SB_PUBLIC_KEY: ${{ secrets.STREAM_SUPABASE_PUBLIC_KEY }}
        run: |
          test -n "$SB_URL" || { echo "::error::STREAM_SUPABASE_URL missing"; exit 1; }
          test "${#SB_PUBLIC_KEY}" -ge 15 || { echo "::error::STREAM_SUPABASE_PUBLIC_KEY missing"; exit 1; }
          case "$SB_URL" in https://*.supabase.co|https://*.supabase.co/) ;; *) echo "::error::Expected HTTPS Supabase project URL"; exit 1;; esac
          printf %s "$SB_URL" | npx --yes wrangler@4 pages secret put STREAM_SUPABASE_URL --project-name streamnow --config wrangler.streamnow.jsonc
          printf %s "$SB_PUBLIC_KEY" | npx --yes wrangler@4 pages secret put STREAM_SUPABASE_PUBLIC_KEY --project-name streamnow --config wrangler.streamnow.jsonc
          echo "Supabase public authentication settings linked; service-role key was not deployed." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy no-cost Pages hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Wrangler Pages deploy refuses custom --config paths; use its required root file
          # only in this ephemeral GitHub runner, preserving the legacy Worker config in Git.
          cp wrangler.streamnow.jsonc wrangler.jsonc
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            branch=main
          else
            branch=contas-compartilhadas
          fi
          npx --yes wrangler@4 pages deploy dist --project-name streamnow --branch "$branch"
      - name: Verify the existing account Worker through Pages
        run: |
          set -euo pipefail
          origin=https://streamnow-2o1.pages.dev/
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            origin=https://contas-compartilhadas.streamnow-2o1.pages.dev/
          fi
          for attempt in {1..8}; do
            if curl -LfSs --max-time 15 "$origin" -o /tmp/streamnow-login.html &&
               grep -q "Acesso individual" /tmp/streamnow-login.html &&
               { grep -Fq 'name="email"' /tmp/streamnow-login.html || grep -Fq "name='email'" /tmp/streamnow-login.html; }; then
              status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "${origin}stream/session")
              if [ "$status" = 401 ]; then
                echo "Pages login and anonymous access check passed at $origin." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 4
          done
          echo "::error::Pages shared-account login could not be verified."
          exit 1
