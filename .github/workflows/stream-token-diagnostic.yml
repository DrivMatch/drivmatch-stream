name: Stream Cloudflare credential diagnostics (read-only)
on:
  push:
    branches: [feature/independent-cloudflare-access]
    paths: ['.github/workflows/stream-token-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-secret:
    name: Verify repository-scoped token
    runs-on: ubuntu-24.04
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.STREAM_INDEPENDENT_CF_API_TOKEN }}
    steps:
      - name: Read-only Cloudflare diagnostics, no secrets printed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Repo secret present: NO"; exit 1
          fi
          echo "Repo secret present: YES"
          if [[ "$CF_TOKEN" == cfat_* ]]; then
            echo "Token format: account API token"
          elif [[ "$CF_TOKEN" == cfut_* ]]; then
            echo "Token format: user API token"
          elif [[ "$CF_TOKEN" == cfoat_* ]]; then
            echo "Token format: Wrangler OAuth, not intended API token"
          elif [[ "$CF_TOKEN" == "Bearer "* ]]; then
            echo "Token format: INCLUDES Bearer prefix (paste bare token instead)"
          elif [[ "$CF_TOKEN" == curl* ]]; then
            echo "Token format: INCLUDES curl example (paste bare token instead)"
          elif [[ "$CF_TOKEN" =~ ^[[:alnum:]]{40}$ ]]; then
            echo "Token format: possible legacy 40-character API token"
          else
            echo "Token format: unrecognized (no token characters disclosed)"
          fi
          if [[ "$CF_TOKEN" == *[[:space:]]* ]]; then echo "Whitespace: FOUND"; else echo "Whitespace: none"; fi
          if [[ "$CF_TOKEN" == \"*\" || "$CF_TOKEN" == \'*\' ]]; then
            echo "Outer quote characters: FOUND"
          else
            echo "Outer quote characters: none"
          fi
          for endpoint in "accounts/$CF_ACCOUNT/tokens/verify" "user/tokens/verify" "accounts/$CF_ACCOUNT/d1/database?per_page=1"; do
            set +e
            http=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/cf-check.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/$endpoint" -H "Authorization: Bearer $CF_TOKEN")
            curl_exit=$?
            set -e
            if [ "$curl_exit" -ne 0 ]; then
              echo "Endpoint check: network error"; continue
            fi
            echo "Endpoint ${endpoint%%\?*}: HTTP $http"
            if [ "$http" = "200" ]; then
              jq -r 'if .success == true then "Result: authorized" else "Result: API rejected" end' /tmp/cf-check.json
            else
              jq -r 'if .errors then (.errors | map(.code|tostring) | join(",")) | "Cloudflare error codes: " + . else "No Cloudflare error code" end' /tmp/cf-check.json 2>/dev/null || true
            fi
          done
  environment-secret:
    name: Verify staging environment effective token
    runs-on: ubuntu-24.04
    environment: stream-independent-test
    env:
      CF_ACCOUNT: ${{ secrets.STREAM_INDEPENDENT_CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.STREAM_INDEPENDENT_CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read-only staging token D1 API check
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Staging secret present: NO"; exit 1
          fi
          echo "Staging secret present: YES"
          if [[ "$CF_TOKEN" == cfat_* ]]; then
            echo "Token format: account API token"
          elif [[ "$CF_TOKEN" == cfut_* ]]; then
            echo "Token format: user API token"
          elif [[ "$CF_TOKEN" == cfoat_* ]]; then
            echo "Token format: Wrangler OAuth, not intended API token"
          elif [[ "$CF_TOKEN" == "Bearer "* ]]; then
            echo "Token format: INCLUDES Bearer prefix (paste bare token instead)"
          elif [[ "$CF_TOKEN" == curl* ]]; then
            echo "Token format: INCLUDES curl example (paste bare token instead)"
          elif [[ "$CF_TOKEN" =~ ^[[:alnum:]]{40}$ ]]; then
            echo "Token format: possible legacy 40-character API token"
          else
            echo "Token format: unrecognized (no token characters disclosed)"
          fi
          if [[ "$CF_TOKEN" == *[[:space:]]* ]]; then echo "Whitespace: FOUND"; else echo "Whitespace: none"; fi
          if [[ "$CF_TOKEN" == \"*\" || "$CF_TOKEN" == \'*\' ]]; then
            echo "Outer quote characters: FOUND"
          else
            echo "Outer quote characters: none"
          fi
          http=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/cf-check.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database?per_page=1" -H "Authorization: Bearer $CF_TOKEN")
          echo "D1 API: HTTP $http"
          if [ "$http" = "200" ]; then
            jq -r 'if .success == true then "Result: authorized" else "Result: API rejected" end' /tmp/cf-check.json
          else
            jq -r 'if .errors then (.errors | map(.code|tostring) | join(",")) | "Cloudflare error codes: " + . else "No Cloudflare error code" end' /tmp/cf-check.json 2>/dev/null || true
          fi

  embedded-token-check:
    name: Verify a token embedded inside the saved curl command (no writes)
    runs-on: ubuntu-24.04
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.STREAM_INDEPENDENT_CF_API_TOKEN }}
    steps:
      - name: Extract only in memory, mask, and verify access without revealing token
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,json,urllib.request,urllib.error,sys
          raw=os.environ.get("CF_TOKEN","")
          match=re.search(r"Bearer\s+(cfat_[A-Za-z0-9]{40,80})(?=[^A-Za-z0-9]|$)",raw,re.I)
          if not match:
              print("Embedded Cloudflare account token: NOT FOUND")
              sys.exit(1)
          token=match.group(1)
          print("::add-mask::"+token)
          print("Embedded Cloudflare account token: FOUND and masked")
          account=os.environ.get("CF_ACCOUNT","")
          url="https://api.cloudflare.com/client/v4/accounts/"+account+"/d1/database?per_page=1"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token})
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  status=r.status
                  body=r.read()
          except urllib.error.HTTPError as error:
              status=error.code
              body=error.read()
          print("Extracted token Cloudflare D1 API status:",status)
          try:
              data=json.loads(body)
              print("Cloudflare success:",data.get("success"))
              print("Cloudflare error codes:",[x.get("code") for x in data.get("errors",[])])
          except Exception:
              print("Could not parse Cloudflare API response")
          if status!=200:sys.exit(1)
          PY
