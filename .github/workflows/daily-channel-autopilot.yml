name: DrivMatch - Autopiloto diario de canais

on:
  schedule:
    # 02:00 America/Sao_Paulo (UTC-3) = 05:00 UTC; GitHub may start late.
    - cron: '0 5 * * *'
    # Retry outside the top of the hour if the primary event was dropped or failed.
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-channel-autopilot.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: drivmatch-daily-channel-autopilot
  cancel-in-progress: false

jobs:
  check-scheduled-retry:
    if: github.event_name == 'schedule' && github.event.schedule == '17 5 * * *'
    permissions:
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_scan: ${{ steps.history.outputs.run_scan }}
    steps:
      - name: Check for a successful scheduled publication today
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(date -u +%F)T05:00:00Z"
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/daily-channel-autopilot.yml/runs"
          successful="$(gh api --method GET "$endpoint" -f event=schedule -f status=success -f "created=>=$since" --jq .total_count)"
          [[ "$successful" =~ ^[0-9]+$ ]]
          if [ "$successful" -eq 0 ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A scheduled catalog run already succeeded today."
          fi

  discover-test-publish:
    needs: check-scheduled-retry
    if: >-
      ${{ !cancelled() && (needs.check-scheduled-retry.result == 'skipped' ||
      needs.check-scheduled-retry.outputs.run_scan == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Code and policy tests
        run: |
          python3 -m py_compile scripts/daily_channel_autopilot.py scripts/global_channel_discovery.py
          python3 -m unittest discover -s tests -p 'test_daily_channel_autopilot.py' -v
          python3 -m unittest discover -s tests -p 'test_global_channel_discovery.py' -v
      - name: Multi-source discovery and 60-second media probes
        env:
          DM_DAILY_MAX_CHECKS: '120'
          DM_DAILY_WORKERS: '12'
        run: python3 scripts/daily_channel_autopilot.py
      - name: Rotate worldwide country scans and multilingual research
        # Research failure must not delete/pollute the independently vetted HLS catalog.
        continue-on-error: true
        run: python3 scripts/global_channel_discovery.py
      - name: Validate catalog artifacts before publishing
        run: |
          python3 -c 'import json,pathlib; p=pathlib.Path("site/daily-autopilot-report.json"); d=json.loads(p.read_text()); assert d["schema"]==1 and d["tested"]>0 and d["sources_responded"]>0, "No valid scan; refuse publishing"; print("Autopilot:",d["tested"],"checked,",d["published_healthy"],"healthy channels")'
          test -s site/daily-autopilot.m3u8
          head -n 1 site/daily-autopilot.m3u8 | grep -q '#EXTM3U'
          python3 -c 'import json,pathlib; s=json.loads(pathlib.Path("data/global-discovery-state.json").read_text()); assert s.get("schema")==1 and isinstance(s.get("channels"),dict) and isinstance(s.get("sources"),dict)'
          git diff --check
      - name: Save vetted catalog automatically
        id: changes
        run: |
          if git diff --quiet -- site/daily-autopilot.m3u8 site/daily-autopilot-state.json site/daily-autopilot-report.json data/global-discovery-state.json data/global-discovery-report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No catalog change"
            exit 0
          fi
          git config user.name "drivmatch-channel-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/daily-autopilot.m3u8 site/daily-autopilot-state.json site/daily-autopilot-report.json data/global-discovery-state.json data/global-discovery-report.json
          git commit -m "chore(channels): daily verified public TV update"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy GitHub Pages after catalog update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          echo "::notice::Stream Pages deployment dispatched"
      - name: Redeploy Stream Now Cloudflare Pages after catalog update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run streamnow-pages.yml --ref main
      - name: Audit report
        if: always()
        run: |
          if [ -f site/daily-autopilot-report.json ]; then
            echo 'Verified public HLS autopilot report:' >> "$GITHUB_STEP_SUMMARY"
            cat site/daily-autopilot-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/global-discovery-report.json ]; then
            echo 'Worldwide research report (candidates not published):' >> "$GITHUB_STEP_SUMMARY"
            cat data/global-discovery-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
