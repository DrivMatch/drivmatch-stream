name: DrivMatch - Autopiloto diario de canais

on:
  schedule:
    # 09:20 America/Sao_Paulo (UTC-3), away from the top-of-hour load.
    - cron: '20 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-channel-autopilot.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: drivmatch-daily-channel-autopilot
  cancel-in-progress: false

jobs:
  discover-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Code and policy tests
        run: |
          python3 -m py_compile scripts/daily_channel_autopilot.py
          python3 -m unittest discover -s tests -p 'test_daily_channel_autopilot.py' -v
      - name: Multi-source discovery and 60-second media probes
        env:
          DM_DAILY_MAX_CHECKS: '120'
          DM_DAILY_WORKERS: '12'
        run: python3 scripts/daily_channel_autopilot.py
      - name: Validate catalog artifacts before publishing
        run: |
          python3 -c 'import json,pathlib; p=pathlib.Path("site/daily-autopilot-report.json"); d=json.loads(p.read_text()); assert d["schema"]==1 and d["tested"]>0 and d["sources_responded"]>0, "No valid scan; refuse publishing"; print("Autopilot:",d["tested"],"checked,",d["published_healthy"],"healthy channels")'
          test -s site/daily-autopilot.m3u8
          head -n 1 site/daily-autopilot.m3u8 | grep -q '#EXTM3U'
          git diff --check
      - name: Save vetted catalog automatically
        id: changes
        run: |
          if git diff --quiet -- site/daily-autopilot.m3u8 site/daily-autopilot-state.json site/daily-autopilot-report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No catalog change"
            exit 0
          fi
          git config user.name "drivmatch-channel-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/daily-autopilot.m3u8 site/daily-autopilot-state.json site/daily-autopilot-report.json
          git commit -m "chore(channels): daily verified public TV update"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy Pages after catalog update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          echo "::notice::Stream Pages deployment dispatched"
      - name: Audit report
        if: always()
        run: |
          if [ -f site/daily-autopilot-report.json ]; then
            echo 'Autopilot report:' >> "$GITHUB_STEP_SUMMARY"
            cat site/daily-autopilot-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
