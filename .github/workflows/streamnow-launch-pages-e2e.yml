name: Stream Now shared accounts through Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [codex/stream-now-launch-preflight]
    paths:
      - '.github/workflows/streamnow-launch-pages-e2e.yml'
permissions:
  contents: read
concurrency:
  group: streamnow-pages-account-smoke
  cancel-in-progress: false
jobs:
  account-smoke:
    if: github.repository == 'DrivMatch/drivmatch-stream'
    runs-on: ubuntu-24.04
    environment: stream-independent-test
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f51c6c8407440a526ba618775efdff7637305624
          persist-credentials: false
      - name: Check Supabase login, catalog, shared favorites and fixture cleanup
        env:
          STREAMNOW_SMOKE_ORIGIN: https://streamnow-2o1.pages.dev
          STREAM_SUPABASE_URL: ${{ secrets.STREAM_SUPABASE_URL }}
          STREAM_SUPABASE_SECRET_KEY: ${{ secrets.STREAM_SUPABASE_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STREAM_INDEPENDENT_CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STREAM_INDEPENDENT_CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          printf 'Official test origin %s\n' "$STREAMNOW_SMOKE_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
          for attempt in {1..20}; do
            if curl -fsS --max-time 8 "$STREAMNOW_SMOKE_ORIGIN/stream/recover" -o "$RUNNER_TEMP/streamnow-recovery.html" &&
               grep -q "Recuperar acesso" "$RUNNER_TEMP/streamnow-recovery.html"; then
              python3 tests/streamnow_staging_smoke.py | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The account Worker did not become available at the official Pages hostname."
          exit 1
