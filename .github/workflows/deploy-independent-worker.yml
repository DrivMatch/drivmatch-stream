name: Cloudflare Stream V2 isolated test deployment
on:
  workflow_dispatch:
  push:
    branches: [codex/stream-now-authorized-recovery]
permissions:
  contents: read
concurrency:
  group: stream-v2-independent-test
  cancel-in-progress: true
jobs:
  test-deploy:
    # Names are test-specific. No routes, existing Workers, DNS, or production changes.
    if: github.repository == 'DrivMatch/drivmatch-stream'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    environment: stream-independent-test
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STREAM_INDEPENDENT_CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.STREAM_INDEPENDENT_CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate code and identity permissions before any Cloudflare deployment
        run: |
          node --check cloudflare/admin-console.mjs
          node --check cloudflare/independent-access.mjs
          node --check site/tv.js
          node --check site/stream.js
          node --test tests/*.test.mjs
      - name: Verify desktop and mobile navigation, favorite sync and HLS decoding
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2 hls.js@1.6.15 @ffmpeg-installer/linux-x64@4.1.0
          npx playwright install chromium
          npm test
          node tests/listas_browser.cjs
          PATH="$PWD/node_modules/@ffmpeg-installer/linux-x64:$PATH" STREAMNOW_QA_OUTPUT="$RUNNER_TEMP/streamnow-visual" node tests/streamnow_integration.cjs
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamnow-browser-visual
          path: ${{ runner.temp }}/streamnow-visual
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify account and token in GitHub secrets
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare credentials missing. Set STREAM_INDEPENDENT_CF_ACCOUNT_ID and STREAM_INDEPENDENT_CF_API_TOKEN in GitHub Actions secrets."
            exit 1
          fi
          test "$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | wc -c)" -eq 32
          if [[ "$CLOUDFLARE_API_TOKEN" == curl* || "$CLOUDFLARE_API_TOKEN" == "Bearer "* ]]; then
            echo "::error::STREAM_INDEPENDENT_CF_API_TOKEN contains a curl command or Bearer header; paste ONLY the raw Cloudflare API token."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == *[[:space:]]* ]]; then
            echo "::error::STREAM_INDEPENDENT_CF_API_TOKEN includes spaces/newlines; paste ONLY the raw token."
            exit 1
          fi
      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4
      - name: Verify the existing isolated D1 test database
        shell: bash
        run: |
          set -euo pipefail
          curl -fSs "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/stream-db-list.json
          jq -e '.success == true' /tmp/stream-db-list.json >/dev/null
          db_id="$(jq -r '.result[] | select(.name=="drivmatch-stream-users-test") | .uuid' /tmp/stream-db-list.json | head -1)"
          if [ -z "$db_id" ]; then
            echo "::error::Existing staging D1 database not found."
            exit 1
          fi
          if ! echo "$db_id" | grep -Eq '^[a-fA-F0-9]{8}-([a-fA-F0-9]{4}-){3}[a-fA-F0-9]{12}$'; then
            echo "::error::Invalid private D1 database ID"
            exit 1
          fi
          cp wrangler.independent.toml.example wrangler.independent.toml
          sed -i "s/REPLACE_WITH_YOUR_PRIVATE_D1_DATABASE_UUID/$db_id/g" wrangler.independent.toml
          sed -i 's/database_name = "drivmatch-stream-users"/database_name = "drivmatch-stream-users-test"/' wrangler.independent.toml
          sed -i 's/name = "drivmatch-stream-independent"/name = "drivmatch-stream-v2-test"/' wrangler.independent.toml
          echo "Isolated Cloudflare D1 ready" >> "$GITHUB_STEP_SUMMARY"
      - name: Snapshot D1 before additive staging migration (ephemeral, not publicly uploaded)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! npx wrangler d1 export drivmatch-stream-users-test --remote \
            --output=/tmp/drivmatch-stream-staging-preupgrade.sql \
            --config wrangler.independent.toml > /tmp/stream-export.log 2>&1; then
            echo "::error::Pre-upgrade D1 export failed; deployment blocked."
            exit 1
          fi
          test -s /tmp/drivmatch-stream-staging-preupgrade.sql
          grep -q 'stream_users' /tmp/drivmatch-stream-staging-preupgrade.sql
          echo "Pre-migration D1 export validated (private ephemeral runner; no public artifact)." >> "$GITHUB_STEP_SUMMARY"
      - name: Apply isolated schema and deploy isolated Worker
        run: |
          npx wrangler d1 migrations apply drivmatch-stream-users-test --remote --config wrangler.independent.toml
          npx wrangler deploy --keep-vars --config wrangler.independent.toml
          echo "Shared guide deployed to the existing Stream Now staging Worker." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the live login UI and canonical logo
        shell: bash
        run: |
          set -euo pipefail
          origin=https://drivmatch-stream-v2-test.drivmatch.workers.dev
          expected=703a88042b16208c46d7a904a82eea444fa9c2e9e3511dfa3b387482770e7186
          for attempt in {1..8}; do
            login=$(curl -sS --max-time 15 -o /tmp/streamnow-login.html -w '%{http_code}' "$origin/stream/login")
            logo=$(curl -sS --max-time 15 -o /tmp/streamnow-logo.jpg -w '%{http_code}' "$origin/stream/logo.jpg")
            echo "Attempt $attempt: login HTTP $login, logo HTTP $logo"
            if [ "$login" = 200 ] && [ "$logo" = 200 ] &&
               grep -Fq "/stream/logo.jpg" /tmp/streamnow-login.html &&
               printf '%s  %s\n' "$expected" /tmp/streamnow-logo.jpg | sha256sum -c; then
              test "$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$origin/stream/favorites")" = 401
              test "$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$origin/tv.html")" = 404
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify real staging Auth and favorites across separate sessions
        env:
          STREAM_SUPABASE_URL: ${{ secrets.STREAM_SUPABASE_URL }}
          STREAM_SUPABASE_SECRET_KEY: ${{ secrets.STREAM_SUPABASE_SECRET_KEY }}
        run: python3 tests/streamnow_staging_smoke.py
