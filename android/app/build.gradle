plugins {
    id 'com.android.application'
}
android {
    namespace 'com.streamnow.app'
    compileSdk 35
    defaultConfig {
        applicationId "com.streamnow.app"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.2.1-test"
        // This exact host is the user's requested target. Never auto-switch to a legacy site.
        buildConfigField "String", "STREAM_DEFAULT_URL", '"https://streamnow.pages.dev/"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
