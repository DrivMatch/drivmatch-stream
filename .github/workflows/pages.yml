name: Deploy DrivMatch Stream (independent)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: stream-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Syntax and separation gates
        run: |
          node --check site/stream.js
          node --check site/stream-boot.js
          node --check site/stream-tv.js
          node --check site/tv.js
          test -s site/tv.html
          test -s site/tv.css
          test -s site/stream-boot.js
          test -s site/stream-tv.js
          node --check site/listas.js
          node --check tests/listas_browser.cjs
          test -s site/listas.html
          test -s site/playlist-sources.json
          test -s site/daily-autopilot.m3u8
          test -s site/daily-autopilot-state.json
          test -s site/daily-autopilot-report.json
          python3 -m py_compile scripts/daily_channel_autopilot.py
          python3 -m unittest discover -s tests -p 'test_daily_channel_autopilot.py' -v
          node --check tests/stream_browser.cjs
          node --input-type=module --check < cloudflare/stream-proxy.mjs
          test -s site/index.html
          grep -q 'fetch("./session"' site/stream.js
          grep -q 'STREAM_ACCESS_PASSWORD' cloudflare/stream-proxy.mjs
          grep -q 'authenticated(request,sessionSecret)' cloudflare/stream-proxy.mjs
          ! grep -i 'supabase' site/stream.js
          ! grep -i 'supabase' cloudflare/stream-proxy.mjs
          if grep -Fq 'target="_blank"' site/stream.js || grep -Fq 'window.open(' site/stream.js; then exit 1; fi
      - name: Cloudflare Access Worker security unit tests
        run: node --test tests/stream_worker.test.mjs
      - name: Install Chromium browser
        run: |
          npm install --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Real browser test (mocked auth and media only)
        run: |
          node tests/stream_browser.cjs
          node tests/listas_browser.cjs
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # GitHub may temporarily return zero artifacts immediately after upload.
      # Allow the Pages artifact metadata to propagate before deployment.
      - name: Wait for GitHub Pages artifact indexing
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
