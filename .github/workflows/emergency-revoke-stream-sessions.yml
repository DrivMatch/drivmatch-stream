name: Emergency isolate Stream sessions and audit roles
on:
  push:
    branches: [feature/independent-cloudflare-access]
    paths: ['.github/workflows/emergency-revoke-stream-sessions.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stream-v2-security-revoke-all-sessions
  cancel-in-progress: false
jobs:
  revoke:
    if: github.repository == 'DrivMatch/drivmatch-stream'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: stream-independent-test
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STREAM_INDEPENDENT_CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.STREAM_INDEPENDENT_CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Invalidate all test sessions; preserve users/favorites; inspect role counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,json,sys
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','').strip()
          token=os.environ.get('CLOUDFLARE_API_TOKEN','').strip()
          if len(account)!=32 or len(token)<12:
              raise SystemExit('BLOCKED: missing Cloudflare test account authorization')
          root='https://api.cloudflare.com/client/v4/accounts/'+account
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def api(endpoint,statement=None):
              req=urllib.request.Request(root+endpoint,headers=headers,
                data=json.dumps({'sql':statement}).encode() if statement is not None else None,
                method='POST' if statement is not None else 'GET')
              with urllib.request.urlopen(req,timeout=30) as response:
                  j=json.load(response)
              if not j.get('success'):raise RuntimeError('Cloudflare request failed')
              return j.get('result')
          dbs=api('/d1/database?per_page=100')
          exact=[d for d in dbs if d['name']=='drivmatch-stream-users-test']
          if len(exact)!=1:
              raise SystemExit('BLOCKED: dedicated test D1 cannot be uniquely identified')
          path='/d1/database/'+exact[0]['uuid']+'/query'
          def query(sql):
              result=api(path,sql)
              if not result or not result[0].get('success'):
                  raise RuntimeError('D1 query failed')
              return result[0].get('results',[])
          roles=query('SELECT role,status,COUNT(*) AS total FROM stream_users GROUP BY role,status')
          print('Existing Stream test account totals by role and status:',roles)
          admins=sum(int(r['total']) for r in roles if r['role']=='admin')
          if admins!=1:
              print('SECURITY WARNING: expected exactly one administrator, observed',admins)
          before=query('SELECT COUNT(*) AS sessions FROM stream_sessions')[0]['sessions']
          query('DELETE FROM stream_sessions')
          after=query('SELECT COUNT(*) AS sessions FROM stream_sessions')[0]['sessions']
          if after!=0:raise RuntimeError('Some sessions remain; incident response incomplete')
          print('SECURITY: invalidated',before,'test sessions. Remaining sessions:',after)
          print('Accounts, invitations, favorites and user role records were not modified.')
          PY
