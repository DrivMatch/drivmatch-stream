name: Publish DrivMatch Stream Android test APK
on:
  push:
    branches: [feature/independent-cloudflare-access]
    paths: ['.github/workflows/publish-android-test.yml']
permissions:
  contents: write
jobs:
  release-test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build isolated Android APK with test Stream URL configured
        working-directory: android
        env:
          STREAM_URL: https://drivmatch-stream-v2-test.drivmatch.workers.dev/stream/
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify installable artifact and built-in URL
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" > /dev/null
          test "$(stat -c '%s' "$apk")" -gt 10000
          sha256sum "$apk"
          echo "Android debug test APK built and validated." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish a stable public prerelease asset for invited Android testers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="stream-android-test-v0.1.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists: publishing new bytes under an existing tag is forbidden"
            exit 1
          fi
          gh release create "$TAG" \
            "android/app/build/outputs/apk/debug/app-debug.apk#DrivMatch-Stream-Test.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DrivMatch Stream Android 0.1.1 — versão de teste" \
            --notes "Versão de teste Android. Aponta exclusivamente para o Stream isolado na Cloudflare (drivmatch-stream-v2-test.drivmatch.workers.dev). Requer conta convidada e senha própria. Não é versão da Play Store. Android 8+. Instale apenas se confiar na origem GitHub DrivMatch; não inclui senha nem token de acesso." \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '.url, (.assets[] | .name+" "+.url)'
