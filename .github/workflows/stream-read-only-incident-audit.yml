name: Read-only Stream security incident audit
on:
  push:
    branches: [feature/independent-cloudflare-access]
    paths: ['.github/workflows/stream-read-only-incident-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'DrivMatch/drivmatch-stream'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: stream-independent-test
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STREAM_INDEPENDENT_CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.STREAM_INDEPENDENT_CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Query only aggregate role, favorites and admin-event counts in isolated D1
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.request, json
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          assert len(account)==32 and token
          base='https://api.cloudflare.com/client/v4/accounts/'+account
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def api(path,sql=None):
              r=urllib.request.Request(base+path,headers=headers,
                method='POST' if sql else 'GET',
                data=json.dumps({'sql':sql}).encode() if sql else None)
              with urllib.request.urlopen(r,timeout=25) as f:j=json.load(f)
              assert j['success'],'Cloudflare request failed'
              return j['result']
          dbs=api('/d1/database?per_page=100')
          db=[x for x in dbs if x['name']=='drivmatch-stream-users-test']
          assert len(db)==1, 'Test D1 not uniquely identified'
          path='/d1/database/'+db[0]['uuid']+'/query'
          def q(sql):
              result=api(path,sql)
              assert result[0]['success']
              return result[0]['results']
          print('READ-ONLY: roles:',q("SELECT role,status,COUNT(*) AS total FROM stream_users GROUP BY role,status"))
          print('READ-ONLY: favorites count:',q('SELECT COUNT(*) AS total FROM stream_favorites'))
          print('READ-ONLY: sessions count:',q('SELECT COUNT(*) AS total FROM stream_sessions'))
          print('READ-ONLY: admin operations by kind:',
                q("SELECT action,COUNT(*) AS total,MAX(created_at) AS latest_utc_epoch FROM stream_admin_events GROUP BY action ORDER BY action"))
          print('READ-ONLY: no names, emails, tokens or private favorites exposed; no mutation attempted.')
          PY
