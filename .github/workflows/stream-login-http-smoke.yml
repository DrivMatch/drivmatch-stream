name: Stream Staging login HTTP smoke test
on:
  push:
    branches: [feature/independent-cloudflare-access]
    paths: ['.github/workflows/stream-login-http-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify mobile-private-browser login form and CSRF protection without real credentials
        shell: bash
        run: |
          set -euo pipefail
          origin="https://drivmatch-stream-v2-test.drivmatch.workers.dev"
          login="$origin/stream/login"
          st_get=$(curl -sS --max-time 30 -c /tmp/stream-cookie-jar -o /tmp/stream-login.html -w '%{http_code}' "$login")
          echo "GET login HTTP: $st_get"
          test "$st_get" = 200
          grep -q "Acesso individual" /tmp/stream-login.html
          csrf=$(python3 - <<'PY'
          import re
          html=open("/tmp/stream-login.html",encoding="utf-8").read()
          match=re.search(r"name='_csrf' value='([A-Za-z0-9_-]{43}\.[A-Za-z0-9_-]{43})'",html)
          if not match: raise SystemExit("Missing signed CSRF hidden token")
          print(match.group(1))
          PY
          )
          echo "Signed CSRF token rendered: YES (never printing token)"
          grep -q "__Host-dm_stream_form_csrf" /tmp/stream-cookie-jar
          st_mobile=$(curl -sS --max-time 30 -b /tmp/stream-cookie-jar \
            -o /tmp/stream-invalid.html -w '%{http_code}' "$login" \
            -X POST -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode 'email=invalid-qa@example.invalid' \
            --data-urlencode 'password=invalid-test-only' \
            --data-urlencode "_csrf=$csrf")
          echo "POST no Origin/Referer/Fetch Metadata with valid signed CSRF HTTP: $st_mobile"
          test "$st_mobile" = 401
          grep -q 'Não foi possível entrar' /tmp/stream-invalid.html
          st_missing=$(curl -sS --max-time 30 -b /tmp/stream-cookie-jar \
            -o /dev/null -w '%{http_code}' "$login" -X POST \
            --data-urlencode 'email=invalid-qa@example.invalid' \
            --data-urlencode 'password=invalid-test-only')
          echo "POST no CSRF field HTTP: $st_missing"
          test "$st_missing" = 403
          missing_body=$(curl -sS --max-time 30 -b /tmp/stream-cookie-jar "$login" -X POST \
            --data-urlencode 'email=invalid-qa@example.invalid' \
            --data-urlencode 'password=invalid-test-only')
          echo "$missing_body" | grep -q 'Código de diagnóstico: F1'
          st_foreign=$(curl -sS --max-time 30 -b /tmp/stream-cookie-jar \
            -o /dev/null -w '%{http_code}' "$login" -X POST \
            -H 'Origin: https://attacker.example' \
            --data-urlencode 'email=invalid-qa@example.invalid' \
            --data-urlencode 'password=invalid-test-only' \
            --data-urlencode "_csrf=$csrf")
          echo "POST foreign Origin with valid signed CSRF HTTP: $st_foreign"
          test "$st_foreign" = 403
          foreign_body=$(curl -sS --max-time 30 -b /tmp/stream-cookie-jar "$login" -X POST \
            -H 'Origin: https://attacker.example' \
            --data-urlencode 'email=invalid-qa@example.invalid' \
            --data-urlencode 'password=invalid-test-only' \
            --data-urlencode "_csrf=$csrf")
          echo "$foreign_body" | grep -q 'Código de diagnóstico: L1'
          st_admin=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$origin/stream/admin")
          echo "GET admin without user cookie HTTP: $st_admin"
          test "$st_admin" = 303
          echo "PASS: private-mobile form works and cross-site/missing-CSRF posts are denied."
